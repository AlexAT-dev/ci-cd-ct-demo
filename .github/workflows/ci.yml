# CI + Continuous Testing.
# Запускається на кожен push / pull request, а також щоночі (регресія за розкладом).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 3 * * *"   # щоночі о 03:00 UTC — нічний регресійний прогін
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  unit-tests:
    name: Unit tests (py${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/unit --junitxml=junit-unit-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit-${{ matrix.python-version }}
          path: junit-unit-*.xml

  integration-tests:
    name: Integration tests + coverage gate
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run integration tests
        run: pytest tests/integration --junitxml=junit-integration.xml
      - name: Coverage gate (fail if < 90%)
        run: pytest tests/unit tests/integration --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-and-coverage
          path: |
            junit-integration.xml
            coverage.xml

  docker-smoke:
    name: Build Docker image + smoke tests
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t shop-api:ci .
      - name: Run container
        run: |
          docker run -d --name shop-api -p 8000:8000 shop-api:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest httpx
      - name: Smoke tests against running container
        env:
          BASE_URL: http://localhost:8000
        run: pytest tests/smoke -v
      - name: Container logs
        if: always()
        run: docker logs shop-api
